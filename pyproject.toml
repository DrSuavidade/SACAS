[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sacas"
version = "0.3.0"
description = "Task-aware repository context routing for AI-assisted development."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SACAS contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sacas = "sacas.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
